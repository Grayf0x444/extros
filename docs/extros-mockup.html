<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EXTROS — Amber Telemetry mockup</title>
<style>
  :root {
    --void:        #0B0D0C;
    --phosphor:    #FFB000;
    --phosphor-dim:#8A5E00;
    --burn:        #FFE9B8;
    --alert:       #FF3B1F;
    --cold:        #4FD1C5;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--void);
    font-family: var(--mono); color: var(--phosphor-dim);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1 1 auto; position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #bar {
    flex: 0 0 auto;
    display: flex; gap: 6px; align-items: center;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid #241a06;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }
  #bar .lbl { color: #5c4206; margin-right: 4px; white-space: nowrap; }
  #bar button {
    font: inherit; letter-spacing: .12em; text-transform: uppercase;
    background: transparent; color: var(--phosphor-dim);
    border: 1px solid #3a2905; border-radius: 2px;
    padding: 7px 10px; cursor: pointer; flex: 1 1 auto;
  }
  #bar button[aria-pressed="true"] { color: var(--void); background: var(--phosphor); border-color: var(--phosphor); }
  #bar button:focus-visible { outline: 2px solid var(--burn); outline-offset: 2px; }
  #hint { padding: 0 10px 10px; font-size: 10px; letter-spacing: .1em; color: #4a3505; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="bar">
  <span class="lbl">Load</span>
  <button data-state="calm" aria-pressed="true">Calm</button>
  <button data-state="surge" aria-pressed="false">Surge</button>
  <button data-state="redline" aria-pressed="false">Redline</button>
  <button data-state="final" aria-pressed="false">Final life</button>
</div>
<div id="hint">Rotate the device — the field transposes. Player emitter stays nearest you.</div>

<script>
'use strict';

// ==== TOKENS ====
var C = {
  void:     '#0B0D0C',
  phos:     '#FFB000',
  dim:      '#8A5E00',
  burn:     '#FFE9B8',
  alert:    '#FF3B1F',
  cold:     '#4FD1C5'
};

// ==== STATE PRESETS ====
// A frozen frame. Only the panel breathes; the contact is held still.
var PRESETS = {
  calm:    { intensity:0.15, rally:47,  vel:412,  integrity:3, pred:1.00, smear:0.30, corrupt:0.00, tear:0.00, final:false },
  surge:   { intensity:0.62, rally:118, vel:806,  integrity:2, pred:0.45, smear:0.75, corrupt:0.10, tear:0.15, final:false },
  redline: { intensity:1.00, rally:203, vel:1188, integrity:1, pred:0.00, smear:1.00, corrupt:0.30, tear:0.45, final:false },
  final:   { intensity:1.00, rally:203, vel:1188, integrity:1, pred:0.00, smear:1.00, corrupt:0.22, tear:0.35, final:true  }
};
var S = PRESETS.calm;
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, portrait = false;
var fx, fy, fw, fh, u;              // field rect + unit
var alongPx, acrossPx;

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var r = document.getElementById('stage').getBoundingClientRect();
  W = Math.max(1, Math.floor(r.width)); H = Math.max(1, Math.floor(r.height));
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  portrait = H > W;
  u = Math.min(W, H) / 100;

  var mx = portrait ? W * 0.07 : W * 0.045;
  var mt = portrait ? H * 0.15  : H * 0.155;
  var mb = portrait ? H * 0.14  : H * 0.105;
  fx = mx; fy = mt; fw = W - mx * 2; fh = H - mt - mb;

  alongPx  = portrait ? fh : fw;
  acrossPx = portrait ? fw : fh;
}

// ==== FIELD TRANSFORM ====
// All game geometry lives in (along, across), each 0..1.
// along 0 = player emitter, along 1 = contact. Portrait puts the player at the bottom.
function pt(a, c) {
  return portrait
    ? { x: fx + c * fw, y: fy + fh - a * fh }
    : { x: fx + a * fw, y: fy + c * fh };
}
function fieldRect(aC, cC, aSize, cSize) {
  var p = pt(aC, cC);
  var w = portrait ? cSize * fw : aSize * fw;
  var h = portrait ? aSize * fh : cSize * fh;
  return { x: p.x - w / 2, y: p.y - h / 2, w: w, h: h };
}

// ==== SCENE (a single held frame) ====
var BALL   = { a: 0.35, c: 0.42, da: -1, dc: 0.62 };
var ORB    = { a: 0.63, c: 0.74 };
var PLAYER = { a: 0.035, c: 0.50, len: 0.22, charge: 0.62 };
var OPP    = { a: 0.965, len: 0.17, c1: 0.30, c2: 0.71 };   // BINARY: two emitters, seam at 0.5

function accent() { return S.final ? C.alert : C.phos; }
function accentDim() { return S.final ? '#7a1a0c' : C.dim; }

// ==== TEXT ====
function corrupt(str) {
  if (S.corrupt <= 0) return str;
  var out = '', junk = '▚▓░ ▞·';
  for (var i = 0; i < str.length; i++) {
    out += (Math.random() < S.corrupt && str[i] !== ' ')
      ? junk[(Math.random() * junk.length) | 0] : str[i];
  }
  return out;
}
function text(str, x, y, size, color, align, track) {
  ctx.save();
  ctx.font = size + 'px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  var sp = track || 0;
  var w = ctx.measureText(str).width + sp * (str.length - 1);
  var sx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  for (var i = 0; i < str.length; i++) {
    ctx.fillText(str[i], sx, y);
    sx += ctx.measureText(str[i]).width + sp;
  }
  ctx.restore();
}
function pad(n, len) { var s = String(n); while (s.length < len) s = '0' + s; return s; }

// ==== COURT ====
function drawCourt(t) {
  var A = accent();
  // measurement grid
  ctx.save(); ctx.globalAlpha = 0.10 * (1 - S.intensity * 0.6); ctx.strokeStyle = A; ctx.lineWidth = 1;
  for (var i = 1; i < 10; i++) {
    var p1 = pt(i / 10, 0), p2 = pt(i / 10, 1);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
  for (var j = 1; j < 6; j++) {
    var q1 = pt(0, j / 6), q2 = pt(1, j / 6);
    ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.stroke();
  }
  ctx.restore();

  // containment boundary — dotted, never solid
  ctx.save(); ctx.strokeStyle = A; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2;
  ctx.setLineDash([3 * u * 0.5, 3 * u * 0.5]);
  ctx.strokeRect(fx, fy, fw, fh); ctx.restore();

  // corner brackets
  ctx.save(); ctx.strokeStyle = A; ctx.lineWidth = 2; ctx.globalAlpha = 0.9;
  var b = u * 3.2;
  [[fx, fy, 1, 1], [fx + fw, fy, -1, 1], [fx, fy + fh, 1, -1], [fx + fw, fy + fh, -1, -1]]
    .forEach(function (k) {
      ctx.beginPath();
      ctx.moveTo(k[0] + b * k[2], k[1]); ctx.lineTo(k[0], k[1]); ctx.lineTo(k[0], k[1] + b * k[3]);
      ctx.stroke();
    });
  ctx.restore();

  // centre range scale
  ctx.save(); ctx.globalAlpha = 0.35; ctx.strokeStyle = A; ctx.lineWidth = 1;
  for (var k2 = 0; k2 <= 20; k2++) {
    var c = k2 / 20, long = (k2 % 5 === 0);
    var m1 = pt(0.5, c);
    var off = (long ? u * 1.5 : u * 0.7);
    var m2 = portrait ? { x: m1.x, y: m1.y } : { x: m1.x, y: m1.y };
    ctx.beginPath();
    if (portrait) { ctx.moveTo(m1.x, m1.y - off); ctx.lineTo(m1.x, m1.y + off); }
    else          { ctx.moveTo(m1.x - off, m1.y); ctx.lineTo(m1.x + off, m1.y); }
    ctx.stroke();
  }
  ctx.restore();
}

// ==== EMITTERS ====
function drawPlayer() {
  var A = accent();
  var thick = 0.016;
  var r = fieldRect(PLAYER.a, PLAYER.c, thick, PLAYER.len);
  ctx.save();
  ctx.strokeStyle = A; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.9;
  ctx.strokeRect(r.x, r.y, r.w, r.h);

  // contact zones: centre 40% quiet, outer bands, outermost 8% is EDGE
  var zones = [[0.00, 0.08, 1.0], [0.08, 0.30, 0.45], [0.30, 0.70, 0.15], [0.70, 0.92, 0.45], [0.92, 1.00, 1.0]];
  zones.forEach(function (z) {
    var s = fieldRect(PLAYER.a, PLAYER.c - PLAYER.len / 2 + PLAYER.len * (z[0] + z[1]) / 2,
                      thick, PLAYER.len * (z[1] - z[0]));
    ctx.globalAlpha = z[2] * 0.8; ctx.fillStyle = A;
    ctx.fillRect(s.x + 1, s.y + 1, Math.max(0, s.w - 2), Math.max(0, s.h - 2));
  });

  // charge fill — lives on the emitter, not in a HUD widget
  ctx.globalAlpha = 1; ctx.fillStyle = C.burn;
  var chargeLen = PLAYER.len * PLAYER.charge;
  var cr = fieldRect(PLAYER.a, PLAYER.c - PLAYER.len / 2 + chargeLen / 2, thick * 0.34, chargeLen);
  ctx.fillRect(cr.x, cr.y, cr.w, cr.h);
  ctx.restore();
}

function drawOpponent() {
  // The one cold colour in the game. It belongs to the thing trying to beat you.
  var thick = 0.016;
  ctx.save();
  [OPP.c1, OPP.c2].forEach(function (c) {
    var r = fieldRect(OPP.a, c, thick, OPP.len);
    ctx.shadowColor = C.cold; ctx.shadowBlur = 12 * (0.4 + S.intensity);
    ctx.fillStyle = C.cold; ctx.globalAlpha = 0.92;
    ctx.fillRect(r.x, r.y, r.w, r.h);
  });
  ctx.shadowBlur = 0;
  // seam marker
  ctx.globalAlpha = 0.5; ctx.strokeStyle = C.cold; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
  var s1 = pt(OPP.a - 0.02, 0.5), s2 = pt(OPP.a - 0.10, 0.5);
  ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
  ctx.restore();
}

// ==== CONTACT + TRAJECTORY ====
function drawTrail() {
  var A = accent();
  var n = 16, len = 0.020 + 0.055 * S.smear;
  var mag = Math.hypot(BALL.da, BALL.dc);
  ctx.save();
  for (var i = n; i > 0; i--) {
    var t = i / n;
    var a = BALL.a - BALL.da / mag * len * t;
    var c = BALL.c - BALL.dc / mag * len * t;
    var p = pt(a, c);
    ctx.globalAlpha = (1 - t) * 0.5;
    ctx.fillStyle = A;
    ctx.beginPath(); ctx.arc(p.x, p.y, u * 1.4 * (1 - t * 0.75), 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function predictPath() {
  var a = BALL.a, c = BALL.c, da = BALL.da, dc = BALL.dc, out = [{ a: a, c: c }], guard = 0;
  var mag = Math.hypot(da, dc); da /= mag; dc /= mag;
  while (a > PLAYER.a && guard++ < 12) {
    var tA = (PLAYER.a - a) / da;
    var tC = dc > 0 ? (1 - c) / dc : (0 - c) / dc;
    var t = Math.min(tA, tC);
    a += da * t; c += dc * t;
    out.push({ a: a, c: c });
    if (tC < tA) dc = -dc;
  }
  return out;
}

function drawPrediction() {
  if (S.pred <= 0) return;
  var path = predictPath();
  // total length, then draw only the fraction the console can still compute
  var segs = [], total = 0, i;
  for (i = 1; i < path.length; i++) {
    var p0 = pt(path[i - 1].a, path[i - 1].c), p1 = pt(path[i].a, path[i].c);
    var d = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    segs.push({ p0: p0, p1: p1, d: d }); total += d;
  }
  var budget = total * S.pred;
  ctx.save();
  ctx.strokeStyle = accent(); ctx.globalAlpha = 0.42; ctx.lineWidth = 1.2;
  ctx.setLineDash([2, 5]);
  for (i = 0; i < segs.length && budget > 0; i++) {
    var s = segs[i], f = Math.min(1, budget / s.d);
    ctx.beginPath(); ctx.moveTo(s.p0.x, s.p0.y);
    ctx.lineTo(s.p0.x + (s.p1.x - s.p0.x) * f, s.p0.y + (s.p1.y - s.p0.y) * f);
    ctx.stroke();
    budget -= s.d;
  }
  ctx.restore();

  // impact marker where it lands, only while the console still reaches that far
  if (S.pred >= 0.95) {
    var end = path[path.length - 1], e = pt(end.a, end.c);
    ctx.save(); ctx.strokeStyle = accent(); ctx.globalAlpha = 0.7; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(e.x, e.y, u * 2.2, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
}

function drawBall(t) {
  var p = pt(BALL.a, BALL.c);
  var rr = u * 1.9;
  ctx.save();
  // vector line
  var mag = Math.hypot(BALL.da, BALL.dc);
  var v = pt(BALL.a + BALL.da / mag * 0.055, BALL.c + BALL.dc / mag * 0.055);
  ctx.strokeStyle = C.burn; ctx.globalAlpha = 0.65; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(v.x, v.y); ctx.stroke();
  // halo + hot core
  ctx.globalAlpha = 0.30; ctx.fillStyle = accent();
  ctx.beginPath(); ctx.arc(p.x, p.y, rr * (2.1 + S.intensity * 0.8), 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = C.burn;
  ctx.shadowColor = C.burn; ctx.shadowBlur = 18 * (0.5 + S.intensity);
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.2832); ctx.fill();
  ctx.restore();
}

// ==== ORB ====
function drawOrb(t) {
  var p = pt(ORB.a, ORB.c), A = accent();
  var r = u * 2.6;
  ctx.save();
  ctx.strokeStyle = A; ctx.globalAlpha = 0.85; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.45, 0, 6.2832); ctx.fill();
  // lock-on brackets
  var g = r * 1.9 + (reduced ? 0 : Math.sin(t / 420) * u * 0.4);
  ctx.globalAlpha = 0.9; ctx.lineWidth = 1.6;
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (k) {
    ctx.beginPath();
    ctx.moveTo(p.x + k[0] * g, p.y + k[1] * g - k[1] * u * 1.3);
    ctx.lineTo(p.x + k[0] * g, p.y + k[1] * g);
    ctx.lineTo(p.x + k[0] * g - k[0] * u * 1.3, p.y + k[1] * g);
    ctx.stroke();
  });
  ctx.restore();
  text('SURGE', p.x, p.y + g + u * 3, u * 1.9, A, 'center', u * 0.2);
}

// ==== HUD ====
function drawHUD(t) {
  var A = accent(), D = accentDim();
  var top = fy - u * 9.5;

  text('EXTROS', fx, top, u * 2.6, D, 'left', u * 0.45);
  text('// CONTAINMENT', fx + u * 17, top, u * 2.0, D, 'left', u * 0.2);

  // score — the biggest thing on screen
  var flick = (S.intensity > 0.8 && !reduced && Math.random() < 0.10) ? 0.35 : 1;
  ctx.save(); ctx.globalAlpha = flick;
  text('RALLY ' + pad(S.rally, 4), fx + fw / 2, fy - u * 4.6, u * (portrait ? 8.5 : 9.5), A, 'center', u * 0.5);
  ctx.restore();
  text('BEST 0259', fx + fw, top, u * 2.1, D, 'right', u * 0.25);

  // integrity — three bars that short out rather than vanish
  var bw = u * 5, bh = u * 1.5, bx = fx, by = top + u * 4;
  for (var i = 0; i < 3; i++) {
    var live = i < S.integrity;
    ctx.save();
    ctx.globalAlpha = live ? 1 : 0.25;
    if (live && S.final && !reduced && Math.random() < 0.3) ctx.globalAlpha = 0.4;
    ctx.fillStyle = live ? (S.final ? C.alert : A) : '#2a1f04';
    ctx.fillRect(bx + i * (bw + u * 1.2), by, bw, bh);
    ctx.restore();
  }
  text('INTEGRITY', bx + 3 * (bw + u * 1.2) + u * 1.5, by + bh / 2, u * 1.8, D, 'left', u * 0.25);

  // telemetry strip — degrades with load
  var ty = fy + fh + u * 4.2, line;
  if (S.final) {
    line = 'INTEGRITY 1 — CONTAINMENT CRITICAL';
  } else {
    line = 'VEL ' + S.vel + ' M/S   VEC 038°   CONTACT BINARY   SEAM 0.50   CHG 62%';
    if (S.intensity > 0.8) line = 'VEL ' + S.vel + ' M/S   VEC ---   PREDICT FAIL   CHG 62%';
  }
  text(corrupt(line), fx, ty, u * 2.1, S.final ? C.alert : D, 'left', u * 0.22);

  if (!S.final) {
    text(corrupt(S.pred > 0 ? 'TRAJECTORY LOCK' : 'TRAJECTORY LOST'),
         fx + fw, ty, u * 2.1, S.pred > 0 ? D : C.alert, 'right', u * 0.22);
  } else {
    text('LAST EMITTER', fx + fw, ty, u * 2.1, C.alert, 'right', u * 0.22);
  }

  // contact classification card
  var cy = fy + fh + u * 8.2;
  text(corrupt('CONTACT: BINARY / TWO EMITTERS / SEAM AT 0.5'), fx, cy, u * 1.8, '#5c4206', 'left', u * 0.18);
}

// ==== PANEL EFFECTS ====
function drawPanel(t) {
  // scanlines
  ctx.save();
  ctx.globalAlpha = 0.06 + S.intensity * 0.05;
  ctx.fillStyle = '#000';
  var roll = reduced ? 0 : (t / 26) % 4;
  for (var y = -4 + roll; y < H; y += 4) ctx.fillRect(0, y, W, 1.6);
  ctx.restore();

  // tear lines
  if (S.tear > 0 && !reduced) {
    for (var i = 0; i < 3; i++) {
      if (Math.random() > S.tear) continue;
      var ty2 = Math.random() * H, th = u * (0.6 + Math.random() * 2);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.10 + Math.random() * 0.16;
      ctx.fillStyle = S.final ? C.alert : C.burn;
      ctx.fillRect(0, ty2, W, th);
      ctx.restore();
    }
  }

  // bloom / whiteout at redline
  if (S.intensity > 0.9) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = reduced ? 0.03 : 0.02 + Math.random() * 0.05;
    ctx.fillStyle = S.final ? C.alert : C.burn;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // vignette
  var g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, S.final ? 'rgba(40,0,0,0.65)' : 'rgba(0,0,0,0.62)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ==== FRAME ====
function render(t) {
  ctx.fillStyle = C.void; ctx.fillRect(0, 0, W, H);
  if (S.final) { ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = C.alert; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  drawCourt(t);
  drawPrediction();
  drawTrail();
  drawOrb(t);
  drawOpponent();
  drawPlayer();
  drawBall(t);
  drawHUD(t);
  drawPanel(t);
}

function loop(t) { render(t); requestAnimationFrame(loop); }

// ==== WIRING ====
var buttons = Array.prototype.slice.call(document.querySelectorAll('#bar button'));
buttons.forEach(function (b) {
  b.addEventListener('click', function () {
    buttons.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
    S = PRESETS[b.dataset.state];
  });
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
